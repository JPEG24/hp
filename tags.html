---
layout: page
title: Tags
permalink: /tags/
---

<h2>タグ一覧</h2>

<ul class="tag-list">
  {% for tag in site.tags %}
    <li>
      <a href="#{{ tag[0] | slugify }}">
        {{ tag[0] }} ({{ tag[1].size }})
      </a>
    </li>
  {% endfor %}
</ul>

<hr>

<h2>タグ別記事一覧</h2>

{% for tag in site.tags %}
  <section id="{{ tag[0] | slugify }}" class="tag-section">
    <h3>{{ tag[0] }}</h3>

    <ul>
      {% for post in tag[1] %}
        <li>
          <a href="{{ post.url | relative_url }}">
            {{ post.title }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endfor %}
