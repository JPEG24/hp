<!doctype html>
<html lang="ja">
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <script src="{{ '/assets/js/get.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/code-copy.js' | relative_url }}" defer></script>

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Squada+One&display=swap" rel="stylesheet">
    {% feed_meta %}
  </head>
  
  <body>
    <header class="site-header">
      <a class="site-title" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/images/icon.png' | relative_url }}" class="site-icon">
        <span>{{ site.title }}</span>
      </a>
      <nav><a href="{{ '/about/' | relative_url }}">このページについて</a></nav>
    </header>
    <main class="site-main">
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>© {{ site.time | date: '%Y' }} WebP</p>
    </footer>
  </body>
</html>
