---
layout: default
---
  
<article class="post">
  <header class="post-header">
    <p class="eyebrow">{{ page.date | date: "%Y.%m.%d" }}</p>
    <div class="post-title">{{ page.title | escape }}</div>
  </header>

  <div class="post-layout">
    <div class="post-content">
      {{ content }}
    </div>

    <nav class="toc">
      <h2>目次</h2>
      <ul id="toc-list"></ul>
    </nav>
  </div>
</article>

<script src="{{ '/assets/js/toc.js' | relative_url }}" defer></script>
