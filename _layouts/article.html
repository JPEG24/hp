---
layout: default
---
  
<article class="article">
  <header class="article-header">
    <p class="eyebrow">{{ page.date | date: "%Y.%m.%d" }}</p>
    <div class="article-title">{{ page.title | escape }}</div>
    {% if page.tags.size > 0 %}
      <div class="tag-list-article">
        {% for tag in page.tags %}
          <div class="tag">{{ tag }}</div>
        {% endfor %}
      </div>
    {% endif %}
  </header>

  <div class="article-layout">
    <div class="article-content">
      {{ content }}
    </div>

    <nav class="toc">
      <h2>目次</h2>
      <ul id="toc-list"></ul>
    </nav>
  </div>
</article>

<script src="{{ '/assets/js/toc.js' | relative_url }}" defer></script>
